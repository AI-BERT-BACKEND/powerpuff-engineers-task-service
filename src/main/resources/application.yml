# ============================================================
# application.yml — single configuration file for task-service
#
# Available profiles (SPRING_PROFILES_ACTIVE):
#   inmemory  — in-memory repository, no database required (default)
#   postgres  — PostgreSQL on local Docker or Azure
#   feign     — real communication with external microservices
#
# Environment variables (only required when the corresponding profile is active):
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, DB_SSL_MODE
#   SUBJECT_SERVICE_URL, ACADEMIC_SERVICE_URL, AUTH_SERVICE_URL
# ============================================================

# -----------------------------------------------------------
# Base configuration (applies to all profiles)
# -----------------------------------------------------------
server:
  port: 1503

spring:
  application:
    name: task-service
  profiles:
    active: inmemory

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    enabled: true

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: BASIC

logging:
  level:
    com.aibert.dosw.infrastructure.external: DEBUG

clients:
  academic-service:
    url: ${ACADEMIC_SERVICE_URL:http://localhost:8084}
  gamification-service:
    url: ${GAMIFICATION_SERVICE_URL:http://localhost:8082}

---
# -----------------------------------------------------------
# Profile: inmemory
# Disables JPA and Flyway autoconfiguration (no database needed).
# -----------------------------------------------------------
spring:
  config:
    activate:
      on-profile: inmemory
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

---
# -----------------------------------------------------------
# Profile: postgres
# Use for local Docker deployment and Azure.
# -----------------------------------------------------------
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

---
# -----------------------------------------------------------
# Profile: feign
# Enables real communication with external microservices.
#
# Required environment variables:
#   ACADEMIC_SERVICE_URL      — base URL for academic-service     (e.g. http://academic-service:8084)
#   GAMIFICATION_SERVICE_URL  — base URL for gamification-service (e.g. http://gamification-service:8082)
#
# NOTE: task-service does NOT call auth-service.
# The API Gateway validates the JWT and injects X-User-Id header.
# -----------------------------------------------------------
spring:
  config:
    activate:
      on-profile: feign
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

clients:
  academic-service:
    url: ${ACADEMIC_SERVICE_URL:http://localhost:8084}
  gamification-service:
    url: ${GAMIFICATION_SERVICE_URL:http://localhost:8082}

feign:
  client:
    config:
      academic-service:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: BASIC
      gamification-service:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: BASIC

---
# -----------------------------------------------------------
# Profile: kafka
# Habilita publicación de eventos de notificación hacia stats-service.
#
# Required environment variables:
#   KAFKA_BOOTSTRAP_SERVERS  — broker Kafka (e.g. kafka:9092)
# -----------------------------------------------------------
spring:
  config:
    activate:
      on-profile: kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka:
  topics:
    task-notifications: task.notifications

---
# -----------------------------------------------------------
# Profile: qa
# Azure QA environment — PostgreSQL + Azure Event Hubs (Kafka-compatible).
#
# Required environment variables:
#   DB_URL, DB_USER, DB_PASSWORD
#   KAFKA_BOOTSTRAP_SERVERS  — aibert-eventhubs-qa.servicebus.windows.net:9093
#   KAFKA_CONNECTION_STRING  — Azure Event Hubs connection string
# -----------------------------------------------------------
spring:
  config:
    activate:
      on-profile: qa
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$ConnectionString\" password=\"${KAFKA_CONNECTION_STRING}\";"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

kafka:
  topics:
    task-notifications: task.notifications