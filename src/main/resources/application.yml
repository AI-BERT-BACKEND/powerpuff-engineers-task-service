server:
  port: 8080

spring:
  application:
    name: task-service
  # Perfil por defecto: in-memory (no requiere base de datos).
  # Para producción/Azure sobreescribir con: SPRING_PROFILES_ACTIVE=postgres
  profiles:
    active: inmemory

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    enabled: true
