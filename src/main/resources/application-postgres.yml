# ============================================================
# Perfil: postgres
# Usar para despliegue local con Docker y en Azure.
#
# Variables de entorno requeridas:
#   DB_HOST      — Ej. local: "localhost" | Azure: "<server>.postgres.database.azure.com"
#   DB_PORT      — Normalmente 5432
#   DB_NAME      — Nombre de la base de datos, ej. "taskdb"
#   DB_USERNAME  — Usuario de PostgreSQL
#   DB_PASSWORD  — Contraseña de PostgreSQL
#   DB_SSL_MODE  — "disable" en local | "require" en Azure
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # validate: Flyway gestiona el esquema; Hibernate solo valida
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
